name: Docker Build

# Avvio solo manuale. Ogni esecuzione:
#   1. calcola la nuova versione (vX.Y.Z) a partire dall'ultimo tag git
#   2. esegue build e pubblicazione dell'immagine su ghcr.io
#   3. crea e pubblica il tag git della versione
#   4. controlla che l'immagine sia scaricabile pubblicamente (senza login)
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Parte della versione da incrementare (ignorato se 'version' è impostato)"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: "Versione esplicita, es. v0.0.1 (lascia vuoto per l'incremento automatico)"
        type: string
        required: false

permissions:
  contents: write   # per pubblicare il tag git
  packages: write   # per pubblicare l'immagine su ghcr.io

concurrency:
  group: docker-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Solo dal branch principale
        if: ${{ github.ref_name != github.event.repository.default_branch }}
        run: |
          echo "::error::Le versioni si pubblicano solo da '${{ github.event.repository.default_branch }}' (eseguito da '${{ github.ref_name }}')."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # serve la lista completa dei tag

      - name: Calcola la versione
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          SEMVER='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          if [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION}"
            [[ "${VERSION}" == v* ]] || VERSION="v${VERSION}"
            if [[ ! "${VERSION}" =~ ${SEMVER} ]]; then
              echo "::error::Versione '${INPUT_VERSION}' non valida: usa il formato vX.Y.Z (es. v0.0.1)."
              exit 1
            fi
          else
            LATEST="$(git tag -l 'v*.*.*' --sort=-v:refname | grep -E "${SEMVER}" | head -n1 || true)"
            if [[ -z "${LATEST}" ]]; then
              VERSION="v0.0.1"
            else
              IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
              case "${INPUT_BUMP}" in
                major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
                minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
                *)     PATCH=$((PATCH + 1)) ;;
              esac
              VERSION="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Il tag ${VERSION} esiste già. Scegli un'altra versione."
            exit 1
          fi

          echo "Versione: ${VERSION}"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=semver,pattern=v{{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=sha
            type=raw,value=latest

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Crea e pubblica il tag git
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "refs/tags/${VERSION}"

      - name: Verifica che l'immagine sia pubblica
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          set -uo pipefail
          REPO_PATH="${IMAGE#${REGISTRY}/}"
          # Richiesta anonima: nessuna credenziale, come farebbe un utente qualsiasi
          TOKEN="$(curl -fsS "https://${REGISTRY}/token?scope=repository:${REPO_PATH}:pull" | jq -r '.token // empty' || true)"
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://${REGISTRY}/v2/${REPO_PATH}/manifests/${VERSION}")"

          if [[ "${STATUS}" == "200" ]]; then
            echo "Immagine pubblica: docker pull ${IMAGE}:${VERSION}"
            {
              echo "### Pubblicata ${VERSION}"
              echo '```'
              echo "docker pull ${IMAGE}:${VERSION}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            PKG="${REPO_PATH#*/}"
            echo "::error::L'immagine non è scaricabile in modo anonimo (HTTP ${STATUS}): il pacchetto è privato. Rendilo pubblico una volta da https://github.com/${GITHUB_REPOSITORY_OWNER}?tab=packages → ${PKG} → Package settings → Change visibility → Public. Le esecuzioni successive manterranno la visibilità."
            exit 1
          fi
