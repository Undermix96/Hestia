name: Docker Build

# Manual trigger only, and only from the default branch. Every run:
#   1. version: computes the new version (vX.Y.Z) from the latest git tag
#   2. tests:   runs the full test suite (tests.yml)
#   3. build:   builds and pushes both images (backend, frontend) to ghcr.io
#               for linux/amd64 and linux/arm64, with immutable tags only
#               (X.Y.Z, vX.Y.Z, sha-...)
#   4. promote: moves the shared tags (X.Y, latest) of both images, only after
#               both builds succeeded, so they always point to the same release
#   5. release: creates and pushes the git tag, only after promote succeeded
#   6. verify:  checks that both images can be pulled anonymously (no login)
#               and that each one is published for both architectures
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Part of the version to bump (ignored when 'version' is set)"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: "Explicit version, e.g. v0.1.0 (leave empty for the automatic bump)"
        type: string
        required: false

# Least privilege by default: every job asks for what it needs.
permissions: {}

concurrency:
  group: docker-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}           # vX.Y.Z (git tag, image tag)
      number: ${{ steps.version.outputs.number }}     # X.Y.Z  (build arg VERSION)
      prefix: ${{ steps.version.outputs.prefix }}     # ghcr.io/<owner>/hestia
    steps:
      - name: Default branch only
        if: ${{ github.ref_name != github.event.repository.default_branch }}
        run: |
          echo "::error::Releases are published only from '${{ github.event.repository.default_branch }}' (this run is on '${{ github.ref_name }}')."
          exit 1

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the full list of tags is needed

      - name: Compute the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          SEMVER='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          if [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION}"
            [[ "${VERSION}" == v* ]] || VERSION="v${VERSION}"
            if [[ ! "${VERSION}" =~ ${SEMVER} ]]; then
              echo "::error::Invalid version '${INPUT_VERSION}': use the vX.Y.Z format (e.g. v0.1.0)."
              exit 1
            fi
          else
            LATEST="$(git tag -l 'v*.*.*' --sort=-v:refname | grep -E "${SEMVER}" | head -n1 || true)"
            if [[ -z "${LATEST}" ]]; then
              VERSION="v0.0.1"
            else
              IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
              case "${INPUT_BUMP}" in
                major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
                minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
                *)     PATCH=$((PATCH + 1)) ;;
              esac
              VERSION="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} already exists. Choose another version."
            exit 1
          fi

          echo "Version: ${VERSION}"
          {
            echo "tag=${VERSION}"
            echo "number=${VERSION#v}"
            # GHCR image names must be lowercase.
            echo "prefix=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/hestia"
          } >> "$GITHUB_OUTPUT"

  tests:
    name: Tests
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  build:
    name: Build ${{ matrix.component }}
    needs: [version, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # to push the images to ghcr.io
    strategy:
      fail-fast: true
      matrix:
        component: [backend, frontend]
    env:
      IMAGE: ${{ needs.version.outputs.prefix }}-${{ matrix.component }}
      VERSION_TAG: ${{ needs.version.outputs.tag }}
      # Put the OCI annotations on the multi-arch index as well as the manifests.
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # The first semver tag sets the org.opencontainers.image.version label:
          # keep X.Y.Z first so it matches the Dockerfile label and /api/version.
          # Only immutable tags here: the moving tags (X.Y, latest) are set by
          # the promote job once both components are published.
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION_TAG }}
            type=semver,pattern=v{{version}},value=${{ env.VERSION_TAG }}
            type=sha
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=hestia-${{ matrix.component }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=hestia-${{ matrix.component }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The build context is the repo root for both images.
          context: .
          file: ./${{ matrix.component }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.number }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Separate cache per component, so the two builds don't evict each other.
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  promote:
    name: Move shared tags
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write   # to retag the images on ghcr.io
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point X.Y and latest to the new release
        env:
          PREFIX: ${{ needs.version.outputs.prefix }}
          NUMBER: ${{ needs.version.outputs.number }}
        run: |
          set -euo pipefail
          MINOR="${NUMBER%.*}"
          # Registry-side copy of the multi-arch index: nothing is rebuilt.
          for COMPONENT in backend frontend; do
            IMAGE="${PREFIX}-${COMPONENT}"
            docker buildx imagetools create \
              --tag "${IMAGE}:${MINOR}" \
              --tag "${IMAGE}:latest" \
              "${IMAGE}:${NUMBER}"
            echo "${IMAGE}: ${MINOR}, latest -> ${NUMBER}"
          done

  release:
    name: Git tag
    needs: [version, promote]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to push the git tag
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create and push the git tag
        env:
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}" "${GITHUB_SHA}"
          git push origin "refs/tags/${VERSION}"

  verify:
    name: Verify public images
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions: {}   # deliberately anonymous: no token, like any user
    steps:
      - name: Check anonymous pull and architectures
        env:
          PREFIX: ${{ needs.version.outputs.prefix }}
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          set -uo pipefail
          FAILED=0
          REQUIRED_PLATFORMS=(linux/amd64 linux/arm64)
          ACCEPT='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'

          {
            echo "### Published ${VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          for COMPONENT in backend frontend; do
            IMAGE="${PREFIX}-${COMPONENT}"
            REPO_PATH="${IMAGE#"${REGISTRY}"/}"
            PKG="${REPO_PATH#*/}"

            # Anonymous request: no credentials, just like any user would do.
            TOKEN="$(curl -fsS "https://${REGISTRY}/token?scope=repository:${REPO_PATH}:pull" | jq -r '.token // empty' || true)"
            BODY="$(mktemp)"
            STATUS="$(curl -s -o "${BODY}" -w '%{http_code}' \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: ${ACCEPT}" \
              "https://${REGISTRY}/v2/${REPO_PATH}/manifests/${VERSION}")"

            if [[ "${STATUS}" != "200" ]]; then
              echo "::error::${IMAGE}:${VERSION} cannot be pulled anonymously (HTTP ${STATUS}): the package is private. Make it public once from https://github.com/${GITHUB_REPOSITORY_OWNER}?tab=packages → ${PKG} → Package settings → Change visibility → Public. Later runs keep the visibility."
              FAILED=1
              continue
            fi

            # The tag must point to a multi-arch index listing every required platform.
            PLATFORMS="$(jq -r '.manifests[]?.platform | select(. != null) | "\(.os)/\(.architecture)"' "${BODY}" | sort -u)"
            for PLATFORM in "${REQUIRED_PLATFORMS[@]}"; do
              if ! grep -qx "${PLATFORM}" <<< "${PLATFORMS}"; then
                echo "::error::${IMAGE}:${VERSION} is missing the ${PLATFORM} image (found: $(tr '\n' ' ' <<< "${PLATFORMS}"))."
                FAILED=1
              fi
            done

            echo "Public image: docker pull ${IMAGE}:${VERSION} ($(tr '\n' ' ' <<< "${PLATFORMS}"))"
            echo "docker pull ${IMAGE}:${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          done

          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "${FAILED}"
