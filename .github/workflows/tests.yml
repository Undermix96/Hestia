name: Tests

# Reusable workflow: the full test suite for backend and frontend.
# Called by ci.yml (every push and pull request) and by docker-build.yml
# (before images are built). Callers must grant at least `contents: read`.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          # Same uv as backend/Dockerfile and the one that wrote uv.lock.
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Import rules (import-linter)
        run: uv run lint-imports

      - name: Pytest
        run: uv run pytest

      - name: OpenAPI contract is up to date
        run: uv run python -m hestia.export_openapi --check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generated API types are up to date
        run: npm run check:api

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: Frontend end-to-end (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The screenshot baselines (frontend/e2e/__screenshots__) are rendered in this image: running the tests in
    # it gives the same browser, fonts and rasterisation. Keep the tag equal to the installed @playwright/test
    # version (frontend/package-lock.json) and regenerate the baselines when it changes (frontend/README.md).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: End-to-end tests (Playwright, with screenshot comparison)
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore
