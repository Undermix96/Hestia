name: CI

# Runs the full test suite on pull requests and on pushes to main.
# Feature branches are tested through their pull request, so a push to a
# branch with an open PR does not run the suite twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer run on the same ref makes older ones pointless: cancel them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
